name: Automatic Update stockpick

on:
  schedule:
    # Berjalan otomatis setiap hari Senin - Jumat pukul 09:00 UTC (16:00 WIB)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    # Memungkinkan pemicuan skrip secara manual lewat tombol di dashboard GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Batalkan Pengecekan Kode Sumber Repositori
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Konfigurasi Ruang Kerja Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Memasang Kompilator Dependensi TA-Lib C-Library
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget
        wget http://sourceforge.net
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install
        cd ..
        rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

    - name: Instalasi Pustaka Python (yfinance, talib, pandas)
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests yfinance TA-Lib
    - name: Eksekusi Mesin Skrining Utama (Kombinasi MA + RSI)
      env:
        ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      run: |
        python py-engine/screener.py

    - name: Mengunggah Pembaruan index.html ke GitHub dengan Aman
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Menandai berkas index.html untuk diunggah
        git add index.html
        
        # Memeriksa apakah ada perubahan nyata pada data website
        if git diff --staged --quiet; then
          echo "Tidak ada perubahan data baru pada saham batubara sore ini."
        else
          git commit -m "Automasi: Perbaruan Dasbor Saham via Sistem Dual-Indikator"
          
          # Strategi Rebase: Menarik data terbaru cloud terlebih dahulu untuk mencegah tabrakan commit
          git pull origin main --rebase
          
          # Mendorong hasil analisis baru ke repositori publik secara aman
          git push origin main
        fi
