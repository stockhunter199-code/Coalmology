name: Automatic Coal Stock Screener

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 17:00 WIB
  workflow_dispatch:

jobs:
  screen-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Libraries Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy pandas-ta requests

    - name: Run Screener Script Inside Engine Folder
      run: |
        cd py-engine
        python screener.py

    - name: Commit and Push Dashboard Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Update Dashboard Realtime Batubara"
        git push
