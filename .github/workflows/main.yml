name: Automatic Coal Stock Screener

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 17:00 WIB
  workflow_dispatch:

jobs:
  screen-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install TA-Lib C Library Dependencies
      run: |
        sudo apt-get update
        # Mengunduh dan menyusun arsitektur C TA-Lib resmi untuk Linux Ubuntu
        wget http://sourceforge.net
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install

    - name: Install Python Wrappers
      run: |
        python -m pip install --upgrade pip
        # Memasang TA-Lib Python beserta yfinance yang kompatibel dengan NumPy terbaru
        pip install yfinance pandas numpy TA-Lib requests

    - name: Run Screener Script Inside Engine Folder
      env:
        ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      run: |
        cd py-engine
        python screener.py

    - name: Commit and Push Dashboard Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Update Dashboard Realtime Batubara via TA-Lib"
        git push
