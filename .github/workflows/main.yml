name: Automatic Coal Stock Screener

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Berjalan otomatis setiap Senin - Jumat pukul 17.00 WIB
  workflow_dispatch:        # Mengaktifkan tombol "Run workflow" manual di tab Actions

jobs:
  screen-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Prebuilt TA-Lib & Dependencies
      run: |
        python -m pip install --upgrade pip
        # Langsung mengunduh wheel pra-kompilasi resmi yang aman dari rate limit 403
        pip install yfinance pandas numpy ta-lib requests

    - name: Run Screener Script Inside Engine Folder
      env:
        ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      run: |
        cd py-engine
        python screener.py

    - name: Commit and Push Dashboard Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Update Dashboard Realtime Batubara via Official TA-Lib Wheel"
        git push
